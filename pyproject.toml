[project]
name = "42-call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "pydantic>=2.13.3",
    "torch>=2.11.0",
    "transformers>=5.8.0",
    "llm-sdk",
    "accelerate>=1.15.0",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[tool.mypy]
# The SDK package lives at llm_sdk/llm_sdk/, with llm_sdk/ being its project
# directory. Without this, mypy resolves "llm_sdk" to that outer directory --
# which has no __init__.py, so it looks like an empty namespace package and
# every "from llm_sdk import Small_LLM_Model" is reported as a missing
# attribute. Pointing mypy_path at the project directory makes it find the
# real package, and with it the real signatures.
mypy_path = "llm_sdk"
exclude = ["^\\.venv/"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

# The SDK is provided by the subject, so its own type errors are not ours to
# fix. ignore_errors silences them while still exposing its signatures to
# src/ -- which matters: follow_imports = "skip" would make them Any instead,
# and --warn-return-any would then fail src/llm.py.
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=1.20.2",
]

# Read by flake8 thanks to the Flake8-pyproject dev dependency.
[tool.flake8]
exclude = [".venv", "__pycache__", ".mypy_cache", "llm_sdk"]
max-line-length = 79

